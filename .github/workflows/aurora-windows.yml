name: Build Neon (Windows installer)

# Run it by hand: Actions tab > "Build Neon (Windows installer)" > Run workflow.
# The installer shows up under "Artifacts" at the bottom of the finished run.
on:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release the in-app updater reads

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # npm install, not npm ci: Neon adds packages (kokoro-js) that the lock file may not list yet
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the app UI
        run: npm run prod

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Version looks like 2026.10.31.7 (date + build number), so every build counts as newer
      - name: Set version
        run: |
          VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          echo "$VERSION" > Version
          echo "!define PRODUCT_VERSION_FROM_FILE \"${VERSION}\"" > Installer/version_define.nsh
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build the Windows app (CEF)
        run: dotnet build Dotnet/VRCX-Cef.csproj -p:Configuration=Release -p:WarningLevel=0 -p:Platform=x64 -p:PlatformTarget=x64 -t:"Clean;Build" -maxcpucount --runtime win-x64 --self-contained

      - name: Install NSIS
        run: choco install nsis -y

      - name: Create installer
        uses: joncloud/makensis-action@v5.0
        with:
          script-file: Installer/installer.nsi
          additional-plugin-paths: Installer/Plugins

      - name: Stage installer and updater
        run: |
          mkdir -p stage
          cp Installer/Neon_Setup_x64.exe stage/
          cp Update-Neon.ps1 Update-Neon.bat stage/

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Neon-Setup
          path: stage
          if-no-files-found: error

      - name: Publish release (the app's updater reads this)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" stage/Neon_Setup_x64.exe \
            --title "Neon ${VERSION}" --generate-notes --latest

      - name: Upload portable folder
        uses: actions/upload-artifact@v7
        with:
          name: Neon-Portable
          path: build/Cef
