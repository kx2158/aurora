name: Build Aura (Windows installer)

# Run it by hand: Actions tab > "Build Aurora (Windows installer)" > Run workflow.
# The installer shows up under "Artifacts" at the bottom of the finished run.
on:
  workflow_dispatch:
    inputs:
      portable:
        description: "Also upload the portable folder (slow, big)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to publish the release the in-app updater reads

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm install, not npm ci: Neon adds packages (kokoro-js) that the lock file may not list yet
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the app UI
        run: npm run prod

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # restored NuGet packages are reused between runs
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Dotnet/**/*.csproj', 'SpaceDrag/**/*.csproj', 'Dotnet/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Version looks like 2026.10.31.7 (date + build number), so every build counts as newer
      - name: Set version
        run: |
          VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          echo "$VERSION" > Version
          echo "!define PRODUCT_VERSION_FROM_FILE \"${VERSION}\"" > Installer/version_define.nsh
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build the Windows app (CEF)
        run: dotnet build Dotnet/VRCX-Cef.csproj -p:Configuration=Release -p:WarningLevel=0 -p:Platform=x64 -p:PlatformTarget=x64 -t:Build -maxcpucount --runtime win-x64 --self-contained

      # Space drag helper. It builds into build/Cef/SpaceDrag, after the app build above so Clean does not remove it.
      - name: Build the space drag helper
        run: dotnet build SpaceDrag/SpaceDrag.csproj -p:Configuration=Release -p:Platform=x64 -p:PlatformTarget=x64 -p:WarningLevel=0 --runtime win-x64 --self-contained

      - name: Install NSIS
        run: |
          if ! command -v makensis >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y
          fi

      - name: Create installer
        shell: pwsh
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          $pluginDir = Split-Path $nsis
          Copy-Item -Recurse -Force Installer\Plugins\* "$pluginDir\Plugins\" -ErrorAction SilentlyContinue
          & $nsis Installer\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage installer and updater
        run: |
          mkdir -p stage
          cp Installer/Aurora_Setup_x64.exe stage/

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Aurora-Setup
          path: stage
          compression-level: 0
          if-no-files-found: error

      - name: Publish release (the app's updater reads this)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" stage/Aurora_Setup_x64.exe \
            --title "Aura ${VERSION}" --generate-notes --latest

      - name: Upload portable folder
        if: ${{ inputs.portable }}
        uses: actions/upload-artifact@v7
        with:
          name: Aurora-Portable
          path: build/Cef
